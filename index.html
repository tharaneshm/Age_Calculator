<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Age Calculator</title>

    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 1s ease;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 16px;
            color: white;
            background: #667eea;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            animation: pop 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Age Calculator</h2>
        <input type="number" id="birthYear" placeholder="Enter birth year">
        <br>
        <button onclick="calculate()">Calculate</button>
        <p id="result"></p>
    </div>

    <script>
        function calculate() {
            let birthYear = document.getElementById("birthYear").value;
            let currentYear = 2026;

            if (birthYear === "" || birthYear > currentYear) {
                document.getElementById("result").innerText =
                    "Please enter a valid year!";
                return;
            }

            let age = currentYear - birthYear;

            document.getElementById("result").innerText =
                "Your Age: " + age;
        }
    </script>

<footer style="
    text-align:bottom center;
    padding:15px;
    background-color:#222;
    color:#fff;
    font-size:14px;
    ">
    Site designed by <strong>Tharanesh
    </strong><br>
    @2026 All rights reserved
</footer>
</body>

</html>
